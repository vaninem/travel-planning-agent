services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel_guides}
      POSTGRES_DB: ${POSTGRES_DB:-travel_guides}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置独立的 PostgreSQL 口令}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - guide_pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  guide_pgdata:
